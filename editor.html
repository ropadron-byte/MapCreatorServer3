<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor · Modo Dios</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/common.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        .app-wrap { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg-deep); color: var(--text); }
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--bg-surface); border-bottom: 1px solid var(--border); }
        .toolbar { display: flex; gap: 10px; align-items: center; padding: 10px; background: var(--bg-card); border-bottom: 1px solid var(--border); }
        .tool-group { display: flex; gap: 5px; background: var(--bg-darker); padding: 5px; border-radius: 4px; border: 1px solid var(--border); }
        .tool-group label { cursor: pointer; padding: 5px 10px; font-size: 12px; border-radius: 3px; }
        .tool-group input[type="radio"] { display: none; }
        .tool-group input[type="radio"]:checked + span { color: var(--gold); font-weight: bold; }
        
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-right { border-left: 1px solid var(--border); border-right: none; }
        .panel { padding: 15px; border-bottom: 1px solid var(--border); }
        .panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); margin-bottom: 10px; font-weight: bold; }
        
        .map-area { flex: 1; overflow: auto; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
        .grid { display: grid; gap: 1px; background-color: var(--border); border: 2px solid var(--border-lit); }
        
        /* MEJORA CELDA E INTERACTIVIDAD */
        .cell { display: flex; align-items: center; justify-content: center; cursor: crosshair; user-select: none; transition: background-color 0.1s ease, transform 0.05s ease; position: relative; }
        .cell:hover { filter: brightness(1.2); }
        
        /* EFECTOS DE RANGO DE MOVIMIENTO Y ACCIÓN */
        .cell.reachable { box-shadow: inset 0 0 6px rgba(0, 210, 255, 0.5); background-color: rgba(0, 210, 255, 0.12) !important; cursor: pointer; }
        .cell.reachable:hover { background-color: rgba(0, 210, 255, 0.3) !important; transform: scale(1.04); z-index: 5; }
        .cell.in-range { box-shadow: inset 0 0 6px rgba(255, 71, 87, 0.4); background-color: rgba(255, 71, 87, 0.08) !important; }
        
        /* PREVISUALIZACIONES DINÁMICAS DE PINCEL */
        .cell.brush-preview-destroy { box-shadow: inset 0 0 0 2px var(--red) !important; background-color: rgba(255, 71, 87, 0.25) !important; }
        .cell.brush-preview-repair { box-shadow: inset 0 0 0 2px var(--green) !important; background-color: rgba(46, 213, 115, 0.25) !important; }

        .log-container { flex: 1; background: var(--bg-darker); padding: 10px; font-family: monospace; font-size: 11px; overflow-y: auto; max-height: 200px; }
        .log-entry { margin-bottom: 4px; color: var(--text-dim); }
        .log-entry.destroy { color: var(--red); }
        .log-entry.repair { color: var(--green); }
        .log-entry.system { color: var(--blue); }
        
        /* TARJETAS DE PERSONAJE MEJORADAS */
        .char-card { background: var(--bg-darker); border: 1px solid var(--border); padding: 10px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; display: flex; gap: 10px; align-items: center; transition: all 0.2s; }
        .char-card:hover { border-color: var(--border-lit); background: var(--bg-card); }
        .char-card.selected { border-color: var(--gold); background: rgba(255, 217, 102, 0.1); }
        .char-info { flex: 1; min-width: 0; }
        .char-name { font-weight: bold; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .char-pos { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .pm-text { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; text-align: right; }
        .pm-bar-wrap { height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
        .pm-bar { height: 100%; transition: width 0.3s ease, background-color 0.3s ease; }
        
        .cell-char-layer { width: 85%; height: 85%; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(0,0,0,0.5); box-shadow: 0 0 4px rgba(0,0,0,0.6); z-index: 3; }
        .cell-char-layer.selected-char { animation: pulseGlow 1.2s infinite alternate; box-shadow: 0 0 8px var(--gold); z-index: 4; }
        
        @keyframes pulseGlow {
            from { transform: scale(1); filter: drop-shadow(0 0 2px var(--gold)); }
            to { transform: scale(1.05); filter: drop-shadow(0 0 6px var(--gold)); }
        }

        .move-btn { width: 30px; height: 30px; background: var(--bg-card); border: 1px solid var(--border); color: #fff; cursor: pointer; border-radius: 4px; }
        .move-btn:hover { background: var(--border-lit); }
        .move-row { display: flex; gap: 5px; justify-content: center; margin-bottom: 5px; }
        .center-btn { background: var(--bg-darker); cursor: default; }
    </style>
</head>
<body>
    <div class="app-wrap">
        <div class="app-header">
            <div>
                <h2 style="color: var(--gold); margin:0; font-family: 'Orbitron';">💥 MODO DIOS</h2>
                <span style="font-size: 12px; color: var(--text-muted);">Editor de Ciudades y Personajes</span>
            </div>
            <div>
                <button onclick="window.location.href='index.html'" class="btn btn-default">← Volver al Generador</button>
            </div>
        </div>

        <div class="toolbar">
            <div class="tool-group">
                <label><input type="radio" name="tool" value="destroy" checked> <span>💥 Destruir</span></label>
                <label><input type="radio" name="tool" value="repair"> <span>🛠️ Reparar</span></label>
                <label><input type="radio" name="tool" value="crop"> <span>✂️ Recortar</span></label>
                <label><input type="radio" name="tool" value="characters"> <span>👤 Personajes</span></label>
            </div>
            
            <div class="tool-group">
                <label style="font-size: 11px; color: var(--text-muted);">Pincel:</label>
                <input type="number" id="brushSize" value="1" min="1" max="5" style="width: 40px; background: var(--bg-darker); border: 1px solid var(--border); color: #fff; text-align: center;">
            </div>

            <button id="undoBtn" class="btn btn-default">↩️ Deshacer</button>
            <button id="zoomInBtn" class="btn btn-default">🔍 +</button>
            <button id="zoomOutBtn" class="btn btn-default">🔍 -</button>
            <button id="screenshotBtn" class="btn btn-blue">📸 Captura</button>
            
            <div style="margin-left: auto; display: flex; gap: 5px;">
                <input type="file" id="importFile" accept=".json" style="display:none">
                <button class="btn btn-blue" onclick="document.getElementById('importFile').click()">📂 Importar JSON</button>
                <button id="exportBtn" class="btn btn-gold">💾 Exportar Proyecto</button>
            </div>
        </div>

        <div class="main-content">
            
            <div class="sidebar">
                <div class="panel">
                    <div class="panel-title">📂 Sistema de Archivos</div>
                    <button id="selectFolderBtn" class="btn btn-blue" style="width: 100%; margin-bottom: 5px;">Seleccionar Carpeta</button>
                    <select id="citySelect" style="width: 100%; margin-bottom: 5px; background: var(--bg-darker); color: #fff; border: 1px solid var(--border);">
                        <option value="">-- Sin carpeta --</option>
                    </select>
                    <button id="loadSelectedBtn" class="btn btn-default" style="width: 100%;">Cargar Ciudad</button>
                </div>
                
                <div class="panel" style="flex: 1; display: flex; flex-direction: column;">
                    <div class="panel-title" style="display: flex; justify-content: space-between;">
                        📜 Registro de Eventos
                        <div>
                            <button id="saveLogBtn" class="btn btn-small btn-blue">💾</button>
                            <button id="clearLogBtn" class="btn btn-small btn-red">🗑️</button>
                        </div>
                    </div>
                    <div id="logContent" class="log-container">
                        <div class="log-entry system">🔌 Sistema iniciado.</div>
                    </div>
                </div>
            </div>

            <div class="map-area" id="mapWrapper">
                <div id="placeholder" style="color: var(--text-dim); text-align: center;">
                    <h3>No hay mapa cargado</h3>
                    <p>Importa un JSON o vuelve al generador.</p>
                </div>
                <div class="grid" id="cityGrid" style="display:none;"></div>
            </div>

            <div class="sidebar sidebar-right">
                <div class="panel">
                    <div class="panel-title">👤 Crear Personaje</div>
                    <input type="text" id="newCharName" placeholder="Nombre" style="width: 100%; margin-bottom: 5px; padding: 5px; background: var(--bg-darker); color:#fff; border: 1px solid var(--border);">
                    <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                        <input type="number" id="newCharMove" placeholder="PM (Ej: 5)" style="width: 50%; padding: 5px; background: var(--bg-darker); color:#fff; border: 1px solid var(--border);" value="5">
                        <input type="number" id="newCharRange" placeholder="Rango" value="1" style="width: 50%; padding: 5px; background: var(--bg-darker); color:#fff; border: 1px solid var(--border);">
                    </div>
                    <div style="display: flex; gap: 5px; margin-bottom: 10px; align-items: center;">
                        <select id="avatarSelect" style="flex: 1; padding: 5px; background: var(--bg-darker); color:#fff; border: 1px solid var(--border);">
                            <option value="default">Avatar Base</option>
                            <option value="🧙‍♂️">🧙‍♂️ Mago</option>
                            <option value="🧝‍♀️">🧝‍♀️ Elfo</option>
                            <option value="🧟">🧟 Zombie</option>
                            <option value="🥷">🥷 Ninja</option>
                        </select>
                        <input type="file" id="charImageUpload" accept="image/*" style="display:none;">
                        <button class="btn btn-default btn-small" onclick="document.getElementById('charImageUpload').click()">🖼️</button>
                    </div>
                    <div id="imgPreview" style="font-size: 10px; color: var(--green); margin-bottom: 5px;">(ninguna imagen)</div>
                    <button id="createCharBtn" class="btn btn-gold" style="width: 100%;">✚ Añadir Personaje</button>
                </div>

                <div class="panel">
                    <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center;">
                        👥 Personajes Activos
                        <div style="display: flex; gap: 4px;">
                            <button id="centerCharBtn" class="btn btn-small btn-blue" title="Centrar en personaje" style="display:none;">🎯</button>
                            <button id="toggleCharsBtn" class="btn btn-small btn-default" title="Ocultar">👁️</button>
                            <button id="deleteAllCharsBtn" class="btn btn-small btn-red" title="Eliminar Todos">🗑️</button>
                        </div>
                    </div>
                    <div id="selectedCharTag" style="display:none; background: rgba(255,217,102,0.1); border: 1px solid var(--gold); padding: 5px; border-radius: 4px; margin-bottom: 10px; align-items: center; justify-content: space-between;">
                        <span style="font-size: 11px; color: var(--gold);"><strong id="selectedCharTagName">Nombre</strong></span>
                        <div style="display: flex; gap: 5px;">
                            <button id="placeCharBtn" class="btn btn-small btn-blue" title="Colocar">📍</button>
                            <button id="deselectBtn" class="btn btn-small btn-default" title="Deseleccionar">❌</button>
                            <button id="deleteCharBtn" class="btn btn-small btn-red" title="Eliminar">🗑️</button>
                        </div>
                    </div>
                    <div id="charListContainer" style="max-height: 250px; overflow-y: auto;">
                        <div style="color:var(--text-muted); font-size:12px;">Sin personajes creados.</div>
                    </div>
                </div>

                <div class="panel" id="movePanel">
                    <div class="panel-title" style="display: flex; justify-content: space-between;">
                        🚶 Movimiento
                        <button id="resetIndividualMoveBtn" class="btn btn-small btn-blue">♻️ Restaurar PM</button>
                    </div>
                    <div style="text-align: center; color: var(--gold); font-size: 12px; margin-bottom: 10px;" id="selectedCharNameMove">Sin selección</div>
                    <div id="moveButtonsContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="data/terrain.js"></script>
    <script src="data/buildings.js"></script>
    <script src="data/names.js"></script>
    <script src="data/cityPresets.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
